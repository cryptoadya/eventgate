name: EventGate demonstration

on:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    name: EventGate demo gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVENTGATE_BASELINE_IMAGE: eventgate-demo:baseline
      EVENTGATE_STABLE_IMAGE: eventgate-demo:candidate
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted EventGate
        working-directory: trusted
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-runtime.lock
          .venv/bin/python -m pip install --no-deps .

      - name: Build Baseline and Candidate
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -a
          source trusted/config/infrastructure.env.example
          set +a
          mkdir -p trusted/results
          baseline_sha="$(git -C trusted rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          test "$baseline_sha" = "$EXPECTED_BASE"
          test "$candidate_sha" = "$EXPECTED_HEAD"
          printf 'baseline=%s\ncandidate=%s\n' "$baseline_sha" "$candidate_sha" > trusted/results/checkout-shas.txt
          docker pull "$EVENTGATE_KAFKA_IMAGE"
          docker pull "$EVENTGATE_POSTGRES_IMAGE"
          docker build -f trusted/docker/payment.Dockerfile \
            --build-arg PAYMENT_VARIANT=stable \
            --build-arg SOURCE_REVISION="$baseline_sha" --build-arg SOURCE_STATE=clean \
            -t "$EVENTGATE_BASELINE_IMAGE" trusted
          docker build -f candidate/docker/payment.Dockerfile \
            --build-arg PAYMENT_VARIANT=stable \
            --build-arg SOURCE_REVISION="$candidate_sha" --build-arg SOURCE_STATE=clean \
            -t "$EVENTGATE_STABLE_IMAGE" candidate

      - name: Verify Candidate
        working-directory: trusted
        run: |
          set -a
          source config/infrastructure.env.example
          set +a
          .venv/bin/eventgate verify --config examples/stable-vs-stable.yaml

      - name: Save available gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eventgate-demo-evidence
          path: trusted/results/
          if-no-files-found: warn
